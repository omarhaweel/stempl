services:
  - type: web
    name: stempl-api
    runtime: node
    rootDir: stempl-backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  - type: web
    name: stempl-web
    runtime: static
    rootDir: stempl-frontend/sempl-app
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_MAPBOX_TOKEN
        sync: false
